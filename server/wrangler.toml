# The deploy workflow fills database_id from the account (never stored here).
name = "owlingstone-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "owlingstone"
database_id = "LOCAL_ONLY"

# Per-address request limit (Workers rate-limit binding, Free plan). Counters live in Cloudflare's memory
# for the period only; addresses are never written anywhere.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
