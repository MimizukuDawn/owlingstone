# Every push and pull request: tests, privacy scan, Python security checks, and a build of the exe
# that is started once to prove it opens.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Privacy scan (no personal data, no secrets)
        run: python tools/privacy_scan.py .
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check bandit==1.9.4
      - name: Tests
        run: python -m pytest -q -m "not slow"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Security checks (bandit)
        run: python -m bandit -q -r bgtracker -ll
      - name: Build the single-file exe
        env:
          OWLINGSTONE_ONEFILE: "1"
        run: pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build Owlingstone.spec
      - name: Start the built exe once
        shell: pwsh
        env:
          OWLINGSTONE_SMOKE: "1"
          BGTRACKER_HOME: ${{ runner.temp }}\smoke
        run: |
          $p = Start-Process dist\Owlingstone.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Owlingstone.exe did not close by itself" }
          if ($p.ExitCode -ne 0) { throw "Owlingstone.exe exited with code $($p.ExitCode)" }
          "started and closed fine; size: {0:N1} MB" -f ((Get-Item dist\Owlingstone.exe).Length / 1MB)

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Server rules (validation, AFK and concede detection)
        run: node --test server/test/quality.test.mjs
