# Every push and pull request: tests, lints, privacy scan, and a build of the exe that is started once
# to prove it opens.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Tests, lints, privacy scan, and a release build that is started once to prove it opens.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Privacy scan (no personal data, no secrets)
        run: python tools/privacy_scan.py .
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Tests
        env:
          OWLINGSTONE_NO_CARD_DOWNLOAD: "1"
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release
      - name: Start the built exe once
        shell: pwsh
        env:
          OWLINGSTONE_HOME: ${{ runner.temp }}\smoke
        run: ./tools/smoke.ps1 target\release\Owlingstone.exe

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Server rules (validation, AFK and concede detection)
        run: node --test server/test/quality.test.mjs
      - name: Daily stats queries (each install's weight capped)
        run: python3 -m unittest discover -s server/test
