# Every push and pull request: tests, privacy scan, Python security checks.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Privacy scan (no personal data, no secrets)
        run: python tools/privacy_scan.py .
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt bandit==1.9.4
      - name: Tests
        run: python -m pytest -q -m "not slow"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Security checks (bandit)
        run: python -m bandit -q -r bgtracker -ll

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Server rules (validation, AFK and concede detection)
        run: node --test server/test/quality.test.mjs
