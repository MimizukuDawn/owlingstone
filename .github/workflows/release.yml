# Builds and publishes a Release like v2.0.0: tests, the Windows exe (Rust), a start-up test of that exe,
# provenance attestation. Players' apps install it only once its signature (Owlingstone.exe.sig, made
# with the maintainer's offline key by tools/release_key.py) is attached: see sign.yml.
# The build job has read-only rights; only the small publish job can write to the repository.
# Runs by itself when a push to main raises the version in Cargo.toml (no Release with that tag yet), or when a
# Release / tag vX.Y.Z is published by hand.
name: Release
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", ".github/workflows/release.yml"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency: release
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.v.outputs.go }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Version to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$v" || { echo "no version in Cargo.toml"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = release ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$v" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx Owlingstone.exe; then
            echo "v$v is already released"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Privacy scan
        run: python tools/privacy_scan.py .
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Tests
        env:
          OWLINGSTONE_NO_CARD_DOWNLOAD: "1"
        run: cargo test --locked --release
      - name: Build the exe (the only download)
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\Owlingstone.exe dist\Owlingstone.exe
      - name: Start the built exe once
        shell: pwsh
        env:
          OWLINGSTONE_HOME: ${{ runner.temp }}\smoke
        run: |
          ./tools/smoke.ps1 dist\Owlingstone.exe
          $v = (Get-Content ([IO.Path]::GetTempPath() + "owlingstone-version.txt") -Raw).Trim()
          if ($v -ne "Owlingstone $env:VERSION") { throw "the exe says '$v', the tag says $env:VERSION" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe
          path: dist/Owlingstone.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    permissions:
      contents: write        # create the Release
      id-token: write        # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe
          path: dist
      - name: Version
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Owlingstone.exe
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          SHA=$(sha256sum dist/Owlingstone.exe | cut -d' ' -f1) python - <<'PY' > notes.md
          import os
          v, out, inside = os.environ["VERSION"], [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  inside = line[3:].split()[0] == v
              elif inside:
                  out.append(line.rstrip())
          notes = "\n".join(out).strip() or "See CHANGELOG.md"
          print("**Download `Owlingstone.exe` below and run it.** That's all: it updates itself.\n\n" + notes +
                "\n\n<details><summary>Check the download (optional)</summary>\n\nSHA-256: `" + os.environ["SHA"] +
                "`\n\nThe app checks this, and the maintainer's signature (Owlingstone.exe.sig), by itself before"
                " every update.</details>")
          PY
      - name: Publish the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="dist/Owlingstone.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Owlingstone $VERSION" --notes-file notes.md
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Owlingstone $VERSION" --notes-file notes.md $files
          fi
