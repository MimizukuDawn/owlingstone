[package]
name = "owlingstone"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "A standalone Hearthstone Battlegrounds helper that reads the game's Power.log"
license-file = "LICENSE.md"
repository = "https://github.com/owlingstone/owlingstone"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "Owlingstone"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
flate2 = "1.1"
hex = "0.4"
rayon = "1.12"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
ureq = { version = "3.1", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Tests run the simulator thousands of times: keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
