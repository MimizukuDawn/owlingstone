[package]
name = "owlingstone"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "A standalone Hearthstone Battlegrounds helper that reads the game's Power.log"
license-file = "LICENSE.md"
repository = "https://github.com/owlingstone/owlingstone"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "Owlingstone"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
flate2 = "1.1"
hex = "0.4"
rayon = "1.12"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
ureq = { version = "3.1", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
uuid = { version = "1", features = ["v4"] }
# The window (Owlingstone.exe only).
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = { version = "0.26", default-features = false }
rfd = { version = "0.17", default-features = false }

# Linux: only to run the window in tests and screenshots (the app is for Windows).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Tests run the simulator thousands of times: keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2

[build-dependencies]
winresource = "0.1"
