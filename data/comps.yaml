# Battlegrounds comps: edit by hand.
#
# Same structure as HDT's comp guides (core cards / addon cards / when to commit / how to play).
# Fields:
#   id           short unique id (used by the preference rules of data/rules.yaml)
#   name         shown name
#   races        tribes needed: the comp is offered only if ALL are in the game
#                ([] = playable in every lobby)
#   core         key cards (exact English names): they define the comp (3 points each)
#   addons       cards that make it stronger (1 point each)
#   difficulty   easy / medium / hard
#   when_to_commit  when to go for this comp
#   how_to_play  play advice in one or two sentences
#   stats        average place (avg, lower = better) and number of games (games)
#
# Source (2026-11-07, patch 37.0.2, season 14): stats from https://bgbuddy.gg/comps, current patch only
# (Firestone community data, Solo, all MMR, about 4 days of games, so smaller samples than before);
# guides first written from the same site on 2026-10-27 (patch 36.6.3). A comp is counted only once
# built, so all have an average better than 4.5: compare comps with each other, not with 4.5.
# No "stats" = a comp without public numbers (opinion only).
# A test checks that each card name exists in the current Solo pool (no Duos, no rotated-out tribe).

# ---------------------------------------------------------------- Aberrations
- id: aberration-discard
  name: Aberration Discard
  races: [ABERRATION]
  core: [Harbinger Aph'lass, Mysterious K'Thir]
  addons: [Nightmare Corroder, N'raqi Frostcaller, Drakkari Enchanter, Felfire Conjurer, Faceless Converter, Cataclysmic Harbinger, De-volition-ist, Cutthroat K'Thir, Mindbender Ghur'sha, Vicious Mindslasher, Sha of Fear, Mindbending Recruiter, Abyssal Envoy]
  difficulty: medium
  when_to_commit: Nightmare Corroder + Mysterious K'Thir + Harbinger Aph'lass (+ Drakkari Enchanter).
  how_to_play: Corroder gives a Sludge Corrosion each turn and K'Thir discards it (cast twice). Boost Tavern spells with Frostcaller or Felfire Conjurer; Aph'lass grows the Deity on every discard.
  stats: {avg: 3.23, games: 5380}

- id: aberration-deathrattle
  name: Aberration Deathrattle
  races: [ABERRATION]
  core: [Faceless Converter, Titus Rivendare]
  addons: [Unwilling Slacker, N'raqi Sapper, Nightmare Corroder, The Shadow of Doubt, Deathstrider, Drifting Sacrifice, Dark Puppeteer]
  difficulty: easy
  when_to_commit: Faceless Converter + Titus Rivendare.
  how_to_play: Cast many Tavern spells so Converter's Deathrattle grows, then Titus doubles it in combat to feed the Deity.
  stats: {avg: 3.58, games: 2190}

- id: aberration-apm
  name: Aberration APM (Pirate bounties)
  races: [ABERRATION, PIRATE]
  core: [Sky Admiral Rogers, Proud Privateer, Faceless Converter]
  addons: [Titus Rivendare, Vicious Mindslasher, The Shadow of Doubt, Brann Bronzebeard]
  difficulty: hard
  when_to_commit: Rogers + Privateer with a Faceless Converter.
  how_to_play: Spend all your gold for Bounties (cast twice with Privateer); every spell grows Converter and Mindslasher.
  # No separate stats: bgbuddy files it under Aberration Deathrattle (Rogers/Privateer = add-ons).

# ---------------------------------------------------------------- Beasts
- id: beast-lobster
  name: Beast Lobster
  races: [BEAST]
  core: [Tasty Lobster, Titus Rivendare, Deathstrider, Headhunter Gryphon]
  addons: [Hoarding Hyena, Sin'dorei Straight Shot, Lurking Lionfish, Snarky Shark, Sprightly Scarab]
  difficulty: medium
  when_to_commit: Headhunter Gryphon + Tasty Lobster + Deathstrider.
  how_to_play: Trigger Tasty Lobster as often as possible (Reborn, Titus); Gryphon + Deathstrider retrigger Deathrattles, Shark and Lionfish give extra attacks.
  stats: {avg: 3.82, games: 14300}

- id: beast-beetles
  name: Beast Beetles
  races: [BEAST]
  core: [Ravaging Scorpid, Turquoise Skitterer, Headhunter Gryphon, Banana Slamma]
  addons: [Forest Rover, Buzzing Vermin, Titus Rivendare, Lurking Lionfish, Deathstrider, Sprightly Scarab, Snarky Shark]
  difficulty: medium
  when_to_commit: Scorpid or Skitterer with Headhunter Gryphon.
  how_to_play: Beetle buffs last the whole game; Banana Slamma doubles the Attack of every Beetle summoned in combat.
  stats: {avg: 3.90, games: 3560}

- id: beast-leviathan
  name: Beast Leviathan
  races: [BEAST]
  core: [Lurking Leviathan, Banana Slamma, Sewer Lord, Headhunter Gryphon]
  addons: [Turquoise Skitterer, Ravaging Scorpid, Titus Rivendare, Lurking Lionfish, Ghastcoiler, Stalwart Kodo, Snarky Shark, Sprightly Scarab, Boon of Beetles]
  difficulty: medium
  when_to_commit: Lurking Leviathan + Sewer Lord + Banana Slamma.
  how_to_play: Cycle Beasts (Shark, Lionfish) to grow Leviathan; protect it with Taunts, losing it usually loses the fight.
  stats: {avg: 3.94, games: 1250}

