# Economy cards (gold, free rerolls, Fodder) and card advantage (extra cards, Discover, Tavern spells,
# Blood Gems...). Read by the planner for the Buy / Sell / Level advice.
#
#   value : points, like a comp "core" card = 3. Worth more early in the game (more turns to use it):
#           x1.2 on turns 2-4, x1 around turn 6, x0.3 late in the game.
#   kind  : gold (gold / rerolls / Fodder) or cards (extra cards)
#   when  : board = pays while on my board (don't sell it),
#           play  = pays once when played (then fine to sell),
#           sell  = pays when sold (sell it when you want the reward)
#   note  : what the card gives (shown in the reason)
# Exact HearthstoneJSON names. Complete / fix freely: reloaded when it changes.

