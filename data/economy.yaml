# Cartes d'économie (or, relances gratuites, Fodder) et d'avantage de cartes (cartes en plus, Discover,
# sorts de taverne, Blood Gems...). Lu par planner.py pour les conseils Buy / Sell / Level.
#
#   value : points, comme une carte "core" de comp = 3. Comptés plus tôt dans la partie (plus de tours
#           pour en profiter) : ×1,2 au tour 2-4, ×1 vers le tour 6, ×0,3 en fin de partie.
#   kind  : gold (or / relances / Fodder) ou cards (cartes en plus)
#   when  : board = rapporte tant qu'elle est sur mon plateau (ne pas la vendre),
#           play  = rapporte une fois en la jouant (après : bonne à vendre),
#           sell  = rapporte en la vendant (à vendre quand on veut la récompense)
#   note  : ce que la carte rapporte (affiché dans la raison)
# Noms exacts de HearthstoneJSON. À compléter / corriger librement : rechargé à chaque démarrage.

