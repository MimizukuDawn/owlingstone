# My preference rules: edit by hand.
#
# A rule = a comp (id from comps.yaml, or a list of ids) + ONE effect with its condition:
#   only_if:   {...}   the comp is offered only when the condition is true
#   never_if:  {...}   the comp is hidden when the condition is true
#   prefer_if: {...}   +bonus points when the condition is true ({} = always)
#   avoid_if:  {...}   -bonus points when the condition is true
#   bonus: 3           (optional) points added / removed; 3 = one core card
#   note: "..."        (optional) text shown when the rule applies
#
# Conditions (all must be true):
#   lobby_has: [PIRATE]            all these tribes are in the game
#   lobby_has_any: [DEMON, DRAGON] at least one of these tribes
#   lobby_lacks: [BEAST]           none of these tribes
#   deity: "C'Thun"                or "Y'Shaarj"
#   hero: "Sir Finley"             my hero
#   hero_power: "Choose Your Champion"   one of my current hero powers (follows changes during the
#                                  game; a list works too: ["A", "B"])
# Tribes: ABERRATION BEAST DEMON DRAGON ELEMENTAL MECHANICAL MURLOC PIRATE QUILBOAR UNDEAD.
# While the tribes are not sure yet, a condition on tribes does nothing.
#
# Already handled without a rule: tribes out of the pool (data/season.yaml) and Duos cards are never offered
# in Solo, and a comp shows only if all its "races" are there (aberration-apm and undead-apm need PIRATE).

# 1. Aberration APM only if Pirates are in the lobby (already true through races, kept as an example).
- comp: aberration-apm
  only_if: {lobby_has: [PIRATE]}

# 2. Aberration Deathrattle if the Deity is C'Thun, not Y'Shaarj.
#    No stats by Deity found (2026-10-27): a personal preference, to check.
- comp: aberration-deathrattle
  prefer_if: {deity: "C'Thun"}
- comp: aberration-deathrattle
  avoid_if: {deity: "Y'Shaarj"}

