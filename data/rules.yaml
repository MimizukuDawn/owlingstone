# Mes règles de préférence (phase 4) — modifiable à la main.
#
# Une règle = une comp (id de comps.yaml, ou une liste d'ids) + UN effet avec sa condition :
#   only_if:   {...}   la comp n'est proposée que si la condition est vraie
#   never_if:  {...}   la comp est cachée si la condition est vraie
#   prefer_if: {...}   +bonus points quand la condition est vraie ({} = toujours)
#   avoid_if:  {...}   -bonus points quand la condition est vraie
#   bonus: 3           (facultatif) points ajoutés/retirés ; 3 = une carte core
#   note: "..."        (facultatif) texte affiché quand la règle s'applique
#
# Conditions (toutes doivent être vraies) :
#   lobby_has: [PIRATE]            toutes ces races sont dans la partie
#   lobby_has_any: [DEMON, DRAGON] au moins une de ces races
#   lobby_lacks: [BEAST]           aucune de ces races
#   deity: "C'Thun"                ou "Y'Shaarj"
#   hero: "Sir Finley"             mon héros
#   hero_power: "Choose Your Champion"   un de mes pouvoirs héroïques actuels (suit les changements
#                                  en cours de partie ; liste possible : ["A", "B"])
# Races : ABERRATION BEAST DEMON DRAGON ELEMENTAL MECHANICAL MURLOC PIRATE QUILBOAR UNDEAD.
# Tant que les races ne sont pas sûres, une condition sur les races ne fait rien.
#
# Déjà géré sans règle : les Naga (hors du pool) et les cartes Duos ne sont jamais proposés en Solo,
# et une comp n'apparaît que si toutes ses "races" sont là (aberration-apm et undead-apm demandent PIRATE).

# 1. Aberration APM seulement si les Pirates sont dans le lobby (déjà vrai via races, gardé comme exemple).
- comp: aberration-apm
  only_if: {lobby_has: [PIRATE]}

# 2. Aberration Deathrattle si la Déité est C'Thun, pas Y'Shaarj.
#    ⚠️ Pas de stats par Déité trouvées (27/10/2026) : préférence personnelle, à vérifier.
- comp: aberration-deathrattle
  prefer_if: {deity: "C'Thun"}
- comp: aberration-deathrattle
  avoid_if: {deity: "Y'Shaarj"}

